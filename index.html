
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Goodies — Cocina</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#f5ede4;--cream2:#ede0d4;
  --burgundy:#7a1530;--burgundy2:#5a0f22;
  --pink:#f0a0b8;--pink-light:#fce8f0;
  --orange:#d4640a;--orange-light:#fde8c8;
  --green:#2e7a2e;--green-light:#d4ebd4;
  --red:#c0202a;--red-light:#ffd8da;
  --yellow:#c8900a;--yellow-light:#fef3d0;
  --text:#3a0a14;--muted:#9a7070;--muted2:#c0a090;
  --border:#e0c8b8;
}
body{background:var(--cream);color:var(--text);font-family:'Nunito',sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* HEADER */
.header{background:var(--burgundy);padding:0.7rem 1rem;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:0.5rem}
.header-logo{width:38px;height:38px;object-fit:contain;border-radius:50%}
.header-sub{font-size:0.65rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--pink);opacity:0.85}
.header-right{display:flex;align-items:center;gap:0.5rem}
.live-pill{display:flex;align-items:center;gap:0.3rem;background:rgba(255,255,255,0.12);padding:0.2rem 0.5rem;border-radius:20px}
.live-dot{width:6px;height:6px;border-radius:50%;background:#5adf5a;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.live-text{font-size:0.58rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.65)}
.hbtn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:var(--cream);padding:0.28rem 0.55rem;border-radius:6px;font-size:0.68rem;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif}

/* DATE BAR */
.date-bar{background:var(--burgundy2);padding:0.3rem 1rem;display:flex;justify-content:space-between;flex-shrink:0}
.date-text{font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--pink);opacity:0.8}
.update-text{font-family:'DM Mono',monospace;font-size:0.6rem;color:rgba(240,160,184,0.45)}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border);flex-shrink:0}
.stat{padding:0.55rem 0.3rem;text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-num{font-family:'Pacifico',cursive;font-size:1.3rem;line-height:1;color:var(--burgundy)}
.stat-num.or{color:var(--orange)}
.stat-num.yw{color:var(--yellow)}
.stat-num.gr{color:var(--green)}
.stat-label{font-size:0.52rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-top:0.1rem}

/* TAB BAR */
.tabs{display:flex;background:white;border-bottom:2px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:0.65rem 0.5rem;text-align:center;cursor:pointer;font-size:0.72rem;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all 0.15s;user-select:none}
.tab.active{color:var(--burgundy);border-bottom-color:var(--burgundy)}
.tab-icon{font-size:1rem;display:block;margin-bottom:0.15rem}

/* PANELS */
.panels{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;display:none;padding:0.7rem 0.8rem;gap:0.55rem;flex-direction:column}
.panel.active{display:flex}

/* FRANJA */
.franja{background:white;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color 0.2s}
.franja.cargada{border-color:var(--yellow)}
.franja.limite{border-color:var(--red)}
.franja-header{display:flex;align-items:center;justify-content:space-between;padding:0.55rem 0.8rem;cursor:pointer;background:var(--cream)}
.franja-hora{font-family:'Pacifico',cursive;font-size:0.88rem;color:var(--burgundy)}
.franja-right{display:flex;align-items:center;gap:0.4rem}
.franja-count{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--muted)}
.fbadge{padding:0.15rem 0.38rem;border-radius:4px;font-size:0.55rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase}
.b-libre{background:var(--cream2);color:var(--muted)}
.b-ok{background:var(--green-light);color:var(--green)}
.b-cargada{background:var(--yellow-light);color:var(--yellow)}
.b-limite{background:var(--red-light);color:var(--red)}
.fchev{font-size:0.65rem;color:var(--muted2);transition:transform 0.2s}
.fchev.open{transform:rotate(90deg)}
.mini-bar{height:3px;background:var(--cream2)}
.mini-fill{height:100%;transition:width 0.4s,background 0.3s}
.pedidos-list{padding:0.5rem 0.6rem 0.6rem;display:flex;flex-direction:column;gap:0.45rem}
.pedidos-list.collapsed{display:none}
.empty-f{text-align:center;font-size:0.68rem;color:var(--muted2);padding:0.5rem;font-style:italic}

/* PEDIDO CARD */
.pedido-card{border:1.5px solid var(--border);border-radius:9px;overflow:hidden;transition:border-color 0.2s,opacity 0.3s;background:white}
.pedido-card.in-progress{border-color:var(--yellow)}
.pedido-card.all-done{opacity:0.45;border-color:var(--green);background:var(--green-light)}

.pcard-top{display:flex;align-items:center;justify-content:space-between;padding:0.45rem 0.65rem;background:var(--cream)}
.pcard-left{display:flex;align-items:center;gap:0.4rem}
.pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-p{background:var(--muted2)}
.dot-i{background:var(--yellow);animation:pulse 1.5s infinite}
.dot-d{background:var(--green)}
.pnombre{font-weight:800;font-size:0.82rem}
.pcard-right{display:flex;align-items:center;gap:0.4rem}
.ptime{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--muted)}
.etag{font-size:0.55rem;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;padding:0.15rem 0.35rem;border-radius:3px}
.et-del{background:var(--pink-light);color:var(--burgundy)}
.et-ret{background:var(--green-light);color:var(--green)}

.pcombo{padding:0.2rem 0.65rem 0;font-size:0.72rem;color:var(--orange);font-weight:700}
.pextras{padding:0.1rem 0.65rem 0;font-size:0.65rem;color:var(--muted)}

/* CHECKLIST */
.checklist{border-top:1px dashed var(--border);display:grid}
.checklist.has-both{grid-template-columns:1fr 1fr}
.checklist.only-papas .ci-burger{display:none}
.checklist.only-burger .ci-papas{display:none}
.checklist.only-papas,.checklist.only-burger{grid-template-columns:1fr}

.ci{padding:0.5rem 0.65rem;display:flex;align-items:center;gap:0.45rem;cursor:pointer;transition:background 0.15s;position:relative}
.ci:first-child{border-right:1px dashed var(--border)}
.checklist.only-papas .ci,.checklist.only-burger .ci{border-right:none}
.ci:hover{background:var(--cream)}
.ci.done{background:var(--green-light)}
.ci.cooking{background:var(--yellow-light)}

.ci-box{width:22px;height:22px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.8rem;transition:all 0.15s}
.ci.done .ci-box{background:var(--green);border-color:var(--green);color:white}
.ci.cooking .ci-box{background:var(--yellow);border-color:var(--yellow);color:white}

.ci-body{flex:1;min-width:0}
.ci-label{font-size:0.72rem;font-weight:700}
.ci-timer{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--muted);margin-top:0.1rem}
.ci.done .ci-timer{color:var(--green)}
.ci.cooking .ci-timer{color:var(--yellow)}

/* MODAL RESUMEN */
.modal-bg{position:fixed;inset:0;background:rgba(58,8,16,0.82);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:white;border-radius:18px;padding:1.5rem;width:100%;max-width:400px;font-family:'Nunito',sans-serif}
.modal-title{font-family:'Pacifico',cursive;font-size:1.5rem;color:var(--burgundy);text-align:center;margin-bottom:1rem}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:0.55rem;margin-bottom:0.7rem}
.mbox{background:var(--cream);border-radius:10px;padding:0.8rem;text-align:center}
.mbox-num{font-size:1.7rem;font-weight:900;color:var(--burgundy);line-height:1}
.mbox-num.gr{color:var(--green)}
.mbox-num.or{color:var(--orange)}
.mbox-label{font-size:0.6rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-top:0.2rem}
.mrow{background:var(--cream);border-radius:10px;padding:0.7rem 0.9rem;margin-bottom:0.55rem}
.mrow-label{font-size:0.6rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:0.2rem}
.mrow-val{font-size:0.88rem;font-weight:800;color:var(--text)}
.mrow-sub{font-size:0.68rem;color:var(--muted)}
.mtotal{background:var(--burgundy);border-radius:10px;padding:0.8rem;text-align:center;margin-bottom:1rem}
.mtotal-label{font-size:0.6rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--pink);opacity:0.8;margin-bottom:0.2rem}
.mtotal-val{font-family:'Pacifico',cursive;font-size:1.6rem;color:white}
.mclose{width:100%;background:var(--burgundy);color:white;border:none;border-radius:9px;padding:0.75rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.88rem;cursor:pointer;text-transform:uppercase;letter-spacing:0.06em}

/* TOAST */
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--burgundy);color:var(--cream);border-radius:8px;padding:0.5rem 0.9rem;font-size:0.78rem;font-weight:700;transition:transform 0.25s;z-index:99;white-space:nowrap;box-shadow:0 4px 14px rgba(58,8,16,0.28)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* NOTIFY BTN */
.notify-float{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%) translateY(100px);z-index:98;transition:transform 0.3s}
.notify-float.show{transform:translateX(-50%) translateY(0)}
.notify-float a{display:block;background:var(--burgundy);color:white;border-radius:9px;padding:0.65rem 1.1rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.78rem;text-decoration:none;text-align:center;box-shadow:0 4px 14px rgba(58,8,16,0.28);white-space:nowrap}
</style>
</head>

<script>
const SHEET_URL='https://script.google.com/macros/s/AKfycby274Dyoyw4VxTBCHmCZJFP0MiOl6xYGrk24adi2UNHd0IN12lf3OD9hbrjtIdIJVrK/exec';
const SCRIPT_URL=SHEET_URL; // mismo endpoint, doPost maneja notificaciones
const FRANJAS=['20:30 – 21:00','21:00 – 21:30','21:30 – 22:00','22:00 – 22:30','22:30 – 23:00','23:00 – 23:30'];
const MAX_F=8;
let pedidos=[];
let estados={};
let collapsed={};
let lastCount=-1;
let audioCtx=null;
let currentTab='all';
let notifyTimer=null;

function today(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function playBeep(){
  try{
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type='sine';o.frequency.setValueAtTime(880,audioCtx.currentTime);
    g.gain.setValueAtTime(0.4,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.6);
    o.start(audioCtx.currentTime);o.stop(audioCtx.currentTime+0.6);
  }catch(e){}
}

function getE(id){
  if(!estados[id]) estados[id]={burger:'pending',papas:'pending',bStart:null,pStart:null,bEnd:null,pEnd:null};
  return estados[id];
}

function tieneBurger(p){
  const c=(p.combo||'').toLowerCase();
  return c.includes('cream')||c.includes('fresh')||c.includes('sweet')||(!c.includes('papa'));
}

function cardStatus(id,hb){
  const e=getE(id);
  const stats=hb?[e.burger,e.papas]:[e.papas];
  if(stats.every(s=>s==='done')) return 'all-done';
  if(stats.some(s=>s==='cooking'||s==='done')) return 'in-progress';
  return '';
}

function dotClass(id,hb){
  const s=cardStatus(id,hb);
  return s==='all-done'?'dot-d':s==='in-progress'?'dot-i':'dot-p';
}

function fmtTimer(start,end){
  if(!start) return '—';
  const el=Math.floor(((end||Date.now())-start)/1000);
  return `${Math.floor(el/60)}:${String(el%60).padStart(2,'0')}`;
}

function cycleItem(id,item){
  const e=getE(id);
  const cur=item==='burger'?e.burger:e.papas;
  const next={pending:'cooking',cooking:'done',done:'pending'}[cur];
  const now=Date.now();
  if(item==='burger'){
    e.burger=next;
    if(next==='cooking') e.bStart=now;
    else if(next==='done') e.bEnd=now;
    else {e.bStart=null;e.bEnd=null;}
  } else {
    e.papas=next;
    if(next==='cooking') e.pStart=now;
    else if(next==='done') e.pEnd=now;
    else {e.pStart=null;e.pEnd=null;}
  }
  // Check if all done → show notify button + send webhook
  const p=pedidos.find(x=>x.id===id);
  if(p){
    const hb=tieneBurger(p);
    if(cardStatus(id,hb)==='all-done'){
      const nf=document.getElementById('notify-float');
      document.getElementById('notify-link').textContent=`📱 Avisar a ${p.nombre} por WhatsApp`;
      nf.classList.add('show');
      nf._pedido = p;
      document.getElementById('notify-link').onclick = (e)=>{ e.preventDefault(); sendNotificacion(nf._pedido); nf.classList.remove('show'); };
      if(notifyTimer) clearTimeout(notifyTimer);
      notifyTimer=setTimeout(()=>nf.classList.remove('show'),7000);
      // Auto-send si hay Instagram ID o usuario
      const hasContact = (p.whatsapp||p.telefono||'').replace(/[^0-9]/g,'').length >= 8;
      if(hasContact){
        sendNotificacion(p);
        showToast('✅ Listo — avisando a ' + p.nombre + '...');
      } else {
        showToast('✅ Listo — avisá al cliente manualmente');
      }
    } else {
      showToast(next==='cooking'?'🔥 Empezando...':next==='done'?'✅ Listo!':'↩ Reiniciado');
    }
  }
  render();
}

function toggleFranja(f){
  collapsed[f]=!collapsed[f];render();
}

function switchTab(tab){
  currentTab=tab;
  ['all','burger','papas'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===tab);
    document.getElementById('panel-'+t).classList.toggle('active',t===tab);
  });
}

function capColor(pct){
  if(pct<0.5) return 'var(--green)';
  if(pct<0.85) return 'var(--yellow)';
  return 'var(--red)';
}

function buildCard(p, mode){
  // mode: 'all' | 'burger' | 'papas'
  const hb=tieneBurger(p);
  const e=getE(p.id);
  const cs=cardStatus(p.id,hb);
  const dc=dotClass(p.id,hb);
  const etag=p.entrega==='delivery'?'<span class="etag et-del">🛵 Delivery</span>':'<span class="etag et-ret">🏠 Retiro</span>';
  const extras=p.adicionales&&p.adicionales!=='Ninguno'?p.adicionales:'';

  // Burger CI
  let burgerCI='';
  if(hb && mode!=='papas'){
    const bst=e.burger;
    const bc=bst==='done'?'done':bst==='cooking'?'cooking':'';
    const bbox=bst==='done'?'✓':bst==='cooking'?'🔥':'';
    const btimer=bst!=='pending'?`<div class="ci-timer">${fmtTimer(e.bStart,e.bEnd)}</div>`:'';
    burgerCI=`<div class="ci ci-burger ${bc}" onclick="cycleItem(${p.id},'burger')">
      <div class="ci-box">${bbox}</div>
      <div class="ci-body"><div class="ci-label">🍔 Burger</div>${btimer}</div>
    </div>`;
  }

  // Papas CI
  let papasCI='';
  if(mode!=='burger'){
    const pst=e.papas;
    const pc=pst==='done'?'done':pst==='cooking'?'cooking':'';
    const pbox=pst==='done'?'✓':pst==='cooking'?'🔥':'';
    const ptimer=pst!=='pending'?`<div class="ci-timer">${fmtTimer(e.pStart,e.pEnd)}</div>`:'';
    papasCI=`<div class="ci ci-papas ${pc}" onclick="cycleItem(${p.id},'papas')">
      <div class="ci-box">${pbox}</div>
      <div class="ci-body"><div class="ci-label">🍟 Papas</div>${ptimer}</div>
    </div>`;
  }

  // Checklist class
  let clClass='checklist';
  if(mode==='all'){
    clClass+= hb?' has-both':' only-papas';
  } else if(mode==='burger'){
    clClass+=' only-burger';
  } else {
    clClass+=' only-papas';
  }

  return `<div class="pedido-card ${cs}" id="card-${p.id}-${mode}">
    <div class="pcard-top">
      <div class="pcard-left">
        <div class="pdot ${dc}"></div>
        <div class="pnombre">${p.nombre}</div>
      </div>
      <div class="pcard-right">
        <span class="ptime">${fmtTime(p.timestamp)}</span>
        ${etag}
      </div>
    </div>
    <div class="pcombo">${p.combo}</div>
    ${extras?`<div class="pextras">+ ${extras}</div>`:''}
    <div class="${clClass}">
      ${burgerCI}
      ${papasCI}
    </div>
  </div>`;
}

function buildFranjas(panelId, mode){
  let html='';
  FRANJAS.forEach(franja=>{
    const fps=pedidos.filter(p=>p.horario===franja);
    // For burger panel: only show pedidos with burger
    // For papas panel: show all (all have papas)
    const filtered=mode==='burger'?fps.filter(p=>tieneBurger(p)):fps;
    const count=filtered.length;
    const pct=count/MAX_F;
    const fc=capColor(pct);
    let bc='b-libre',bt='Libre';
    if(count>0&&pct<0.5){bc='b-ok';bt='OK';}
    else if(pct>=0.5&&pct<0.85){bc='b-cargada';bt='Cargada';}
    else if(pct>=0.85){bc='b-limite';bt='¡Límite!';}
    const fk=`${mode}-${franja}`;
    const isOpen=!collapsed[fk];
    const fc2=pct>=0.85?'limite':pct>=0.5?'cargada':'';

    html+=`<div class="franja ${fc2}">
      <div class="franja-header" onclick="toggleFranja('${fk}')">
        <div class="franja-hora">${franja}</div>
        <div class="franja-right">
          <span class="franja-count">${count}/${MAX_F}</span>
          <span class="fbadge ${bc}">${bt}</span>
          <span class="fchev ${isOpen?'open':''}">▶</span>
        </div>
      </div>
      <div class="mini-bar"><div class="mini-fill" style="width:${Math.min(pct,1)*100}%;background:${fc}"></div></div>
      <div class="pedidos-list ${isOpen?'':'collapsed'}">
        ${filtered.length===0?'<div class="empty-f">Sin pedidos</div>':filtered.map(p=>buildCard(p,mode)).join('')}
      </div>
    </div>`;
  });
  return html;
}

function fmtTime(d){
  if(!(d instanceof Date)||isNaN(d)) return '—';
  return d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
}

function render(){
  const d=new Date();
  document.getElementById('date-text').textContent=d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();

  const total=pedidos.length;
  let prog=0,done=0,pend=0;
  pedidos.forEach(p=>{
    const s=cardStatus(p.id,tieneBurger(p));
    if(s==='all-done') done++;
    else if(s==='in-progress') prog++;
    else pend++;
  });
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-prog').textContent=prog;
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-pend').textContent=pend;

  document.getElementById('panel-all').innerHTML=buildFranjas('panel-all','all');
  document.getElementById('panel-burger').innerHTML=buildFranjas('panel-burger','burger');
  document.getElementById('panel-papas').innerHTML=buildFranjas('panel-papas','papas');
}

function parsePedidos(rows){
  if(!rows||rows.length<2) return [];
  const h=rows[0];
  const col=n=>h.findIndex(x=>x&&x.toString().toLowerCase().includes(n.toLowerCase()));
  const iC=col('Combo'),iA=col('Adicionales'),iE=col('Entrega');
  const iH=col('Horario'),iN=col('Nombre'),iTo=col('Total'),iTs=0;
  const iIg=col('Instagram');
  const iWa=col('WhatsApp');
  const td=today();
  return rows.slice(1).filter(r=>{
    if(!r[iN]) return false;
    if(r[iTs]){
      const dd=new Date(r[iTs]);
      if(!isNaN(dd)){
        const ds=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
        return ds===td;
      }
    }
    return true;
  }).map((r,i)=>({
    id:i,timestamp:r[iTs]?new Date(r[iTs]):new Date(),
    combo:r[iC]||'—',adicionales:r[iA]||'',
    entrega:(r[iE]||'retiro').toLowerCase(),
    horario:r[iH]||'',nombre:r[iN]||'Sin nombre',total:r[iTo]||'',instagram:iIg>=0?(r[iIg]||''):'',
    whatsapp:iWa>=0?(r[iWa]||''):(iIg>=0?(r[iIg]||''):'')
  }));
}

function checkNew(n){
  if(lastCount===-1){lastCount=n;return;}
  if(n>lastCount){
    playBeep();
    const hdr=document.querySelector('.header');
    if(hdr){
      hdr.style.background='var(--pink)';
      setTimeout(()=>hdr.style.background='var(--burgundy)',800);
      setTimeout(()=>hdr.style.background='var(--pink)',1500);
      setTimeout(()=>hdr.style.background='var(--burgundy)',2200);
    }
    showToast(`🍔 +${n-lastCount} pedido${n-lastCount>1?'s':''} nuevo${n-lastCount>1?'s':''}`);
  }
  lastCount=n;
}

async function sendNotificacion(p){
  // Limpiar número de WhatsApp — eliminar espacios, guiones, paréntesis
  const rawNum = (p.whatsapp||p.telefono||'').replace(/[\s\-\(\)]/g,'');
  if(!rawNum || rawNum.length < 8 || rawNum === '—'){
    showToast('⚠ Sin WhatsApp — avisá manualmente');
    mostrarBotonManual(p);
    return;
  }

  // Asegurar formato Argentina: si no empieza con 54, agregarlo
  let num = rawNum;
  if(num.startsWith('0')) num = num.slice(1);
  if(!num.startsWith('54')) num = '54' + num;

  // Mensaje diferenciado por tipo de entrega
  let msg;
  if(p.entrega === 'delivery'){
    msg = '¡Hola ' + p.nombre + '! 🛵 Tu pedido de Goodies ya está en camino. ' +
          'Combo: ' + p.combo + '. ' +
          'En breve lo tenés en tu puerta. ¡Gracias por elegirnos! 🍔';
  } else {
    msg = '¡Hola ' + p.nombre + '! 🏠 Tu pedido de Goodies ya está listo para retirar. ' +
          'Combo: ' + p.combo + '. ' +
          'Pasá cuando quieras. ¡Gracias por elegirnos! 🍔';
  }

  const url = 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg);

  // Abrir WhatsApp con el mensaje pre-armado
  window.open(url, '_blank');
  showToast('📱 WhatsApp abierto — tocá enviar');
}

function mostrarBotonManual(p){
  // Fallback: si no hay número, mostrar botón para abrir DM de Instagram
  const nf = document.getElementById('notify-float');
  const nl = document.getElementById('notify-link');
  if(p.instagram && p.instagram.length > 1){
    nl.href = 'https://ig.me/m/goodiesbs';
    nl.textContent = '📩 Avisar a ' + p.nombre + ' por Instagram';
  } else {
    nl.href = '#';
    nl.textContent = '⚠ Sin contacto — avisá manualmente';
  }
  nf.classList.add('show');
  if(notifyTimer) clearTimeout(notifyTimer);
  notifyTimer = setTimeout(()=>nf.classList.remove('show'), 8000);
}


// Timers update every second
function updateTimers(){
  pedidos.forEach(p=>{
    const e=estados[p.id];
    if(!e) return;
    ['all','burger','papas'].forEach(mode=>{
      const card=document.getElementById(`card-${p.id}-${mode}`);
      if(!card) return;
      if(e.burger==='cooking'){
        const el=card.querySelector('.ci-burger .ci-timer');
        if(el) el.textContent=fmtTimer(e.bStart,null);
      }
      if(e.papas==='cooking'){
        const el=card.querySelector('.ci-papas .ci-timer');
        if(el) el.textContent=fmtTimer(e.pStart,null);
      }
    });
  });
}

setInterval(updateTimers,1000);
